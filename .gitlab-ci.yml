stages:
  - build
  - deploy

build:
  stage: build
  image: node:20-alpine
  script:
    - npm ci
    - npm run build
  variables:
    BASE_PATH: "/Portfolio/"
  artifacts:
    paths:
      - dist/public/
    expire_in: 1 hour
  only:
    - main
    - stage

pages:
  stage: deploy
  image: alpine:latest
  script:
    - mv dist/public public
  artifacts:
    paths:
      - public/
  only:
    - main
    - stage
